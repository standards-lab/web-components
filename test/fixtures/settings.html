<!doctype html>
<!-- The settings case's page: a Settings dialog holding sl-settings, opened by S or its button, a
     help dialog holding sl-shortcuts, opened by ? or its button, and a page of the bindings the
     settings turn off: the Help button's ?, the Settings button's S, a Pages button's P, which
     counts its clicks in window.pages, a Search button bound to Control+K, which the off switch
     leaves on, and J and K, which the page registers, each counting its runs in window.ran. Each
     dialog's Close is bound to its opener's key, inside the dialog. The foundation's full entry
     styles the page and registers every profile, and window.keys and window.preferences are the
     installed foundation's keys and preferences modules, the ones the element reads.
     window.errors collects every error and unhandled rejection the page raises; window.ready
     settles once both elements have rendered. Its import map is components.html's.
     Adapted from spike-html-hosting-components (9fa5850): test/fixtures/settings.html, on
     @standards-lab/web-foundation, J and K registered by the page in place of sl-section-tree's. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>settings case</title>
    <script>
      window.errors = [];
      window.addEventListener("error", (event) => window.errors.push(String(event.message)));
      window.addEventListener("unhandledrejection", (event) =>
        window.errors.push(String(event.reason)),
      );
    </script>
    <link rel="stylesheet" href="/deps/@standards-lab/web-foundation/dist/page-full.css" />
    <script type="importmap">
      {
        "imports": {
          "lit": "/deps/lit/index.js",
          "lit/": "/deps/lit/",
          "lit-html": "/deps/lit-html/lit-html.js",
          "lit-html/": "/deps/lit-html/",
          "lit-element/": "/deps/lit-element/",
          "@lit/reactive-element": "/deps/@lit/reactive-element/reactive-element.js",
          "@lit/reactive-element/": "/deps/@lit/reactive-element/",
          "marked": "/deps/marked/lib/marked.esm.js",
          "@standards-lab/web-foundation/": "/deps/@standards-lab/web-foundation/dist/",
          "@standards-lab/web-icons/octicon/x-16": "/deps/@standards-lab/web-icons/dist/octicon/x-16.js"
        }
      }
    </script>
    <script type="module">
      import "@standards-lab/web-foundation/register-full.js";
      import * as preferences from "@standards-lab/web-foundation/preferences.js";
      import * as keys from "@standards-lab/web-foundation/keys.js";
      import "/dist/shortcuts.js";
      import "/dist/settings.js";

      window.keys = keys;
      window.preferences = preferences;
      window.pages = 0;
      window.ran = 0;
      document.querySelector("#pages").addEventListener("click", () => window.pages++);
      keys.register("j", "Next section", () => window.ran++);
      keys.register("k", "Previous section", () => window.ran++);
      window.ready = Promise.all(
        ["sl-shortcuts", "sl-settings"].map((tag) =>
          customElements.whenDefined(tag).then(() => document.querySelector(tag).updateComplete),
        ),
      );
    </script>
  </head>
  <body>
    <header>
      <h1>Settings</h1>
      <p>
        <button type="button" id="pages" aria-label="Pages" data-keys="p">
          <span aria-hidden="true"><kbd>P</kbd></span>
        </button>
        <button type="button" commandfor="help" command="show-modal" aria-label="Help" data-keys="?">
          <span aria-hidden="true"><kbd>?</kbd></span>
        </button>
        <button
          type="button"
          commandfor="settings"
          command="show-modal"
          aria-label="Settings"
          data-keys="s"
        >
          <span aria-hidden="true"><kbd>S</kbd></span>
        </button>
        <button type="button" id="search" data-keys="Control+k">
          Search <kbd>Ctrl</kbd>+<kbd>K</kbd>
        </button>
      </p>
    </header>
    <main>
      <h2 id="first">First</h2>
      <p>A section to move to.</p>
    </main>
    <dialog id="help" aria-labelledby="help-title">
      <h2 id="help-title" tabindex="-1" autofocus>Keyboard shortcuts</h2>
      <sl-shortcuts></sl-shortcuts>
      <button type="button" commandfor="help" command="close" data-keys="?">
        Close <kbd>?</kbd>
      </button>
    </dialog>
    <dialog id="settings" aria-labelledby="settings-title">
      <h2 id="settings-title">Settings</h2>
      <sl-settings></sl-settings>
      <button type="button" id="settings-close" commandfor="settings" command="close" data-keys="s">
        Close <kbd>S</kbd>
      </button>
    </dialog>
  </body>
</html>
