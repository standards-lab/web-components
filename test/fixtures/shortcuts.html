<!doctype html>
<!-- The shortcuts case's page: a help dialog holding sl-shortcuts, opened by ? or its button, and
     a page of bindings to list: the Help button's ?, a Search button's Control+K, a link's G then
     E, and two the page registers, J and Alt+N, each counting its runs in window.ran. The dialog's
     Close is bound to ? inside the dialog, so bindings() leaves it out. The foundation's full entry
     styles the page, and window.keys is the installed foundation's keys module, the one the element
     reads. window.errors collects every error and unhandled rejection the page raises;
     window.ready settles once the element has rendered. Its import map is components.html's. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>shortcuts case</title>
    <script>
      window.errors = [];
      window.addEventListener("error", (event) => window.errors.push(String(event.message)));
      window.addEventListener("unhandledrejection", (event) =>
        window.errors.push(String(event.reason)),
      );
    </script>
    <link rel="stylesheet" href="/deps/@standards-lab/web-foundation/dist/page-full.css" />
    <script type="importmap">
      {
        "imports": {
          "lit": "/deps/lit/index.js",
          "lit/": "/deps/lit/",
          "lit-html": "/deps/lit-html/lit-html.js",
          "lit-html/": "/deps/lit-html/",
          "lit-element/": "/deps/lit-element/",
          "@lit/reactive-element": "/deps/@lit/reactive-element/reactive-element.js",
          "@lit/reactive-element/": "/deps/@lit/reactive-element/",
          "marked": "/deps/marked/lib/marked.esm.js",
          "@standards-lab/web-foundation/": "/deps/@standards-lab/web-foundation/dist/",
          "@standards-lab/web-icons/octicon/x-16": "/deps/@standards-lab/web-icons/dist/octicon/x-16.js"
        }
      }
    </script>
    <script type="module">
      import "@standards-lab/web-foundation/register-full.js";
      import * as keys from "@standards-lab/web-foundation/keys.js";
      import "/dist/shortcuts.js";

      window.keys = keys;
      window.ran = 0;
      keys.register("j", "Next section", () => window.ran++);
      keys.register("Alt+n", "New note", () => window.ran++);
      window.ready = customElements
        .whenDefined("sl-shortcuts")
        .then(() => document.querySelector("sl-shortcuts").updateComplete);
    </script>
  </head>
  <body>
    <header>
      <h1>Shortcuts</h1>
      <p>
        <button type="button" commandfor="help" command="show-modal" aria-label="Help" data-keys="?">
          <span aria-hidden="true"><kbd>?</kbd></span>
        </button>
        <button type="button" id="search" data-keys="Control+k">
          Search <kbd>Ctrl</kbd>+<kbd>K</kbd>
        </button>
        <a href="#end" data-keys="g e">End</a>
      </p>
    </header>
    <main>
      <h2 id="first">First</h2>
      <p>A section to move to.</p>
      <h2 id="end">End</h2>
      <p>The last section.</p>
    </main>
    <dialog id="help" aria-labelledby="help-title">
      <h2 id="help-title" tabindex="-1" autofocus>Keyboard shortcuts</h2>
      <sl-shortcuts></sl-shortcuts>
      <button type="button" commandfor="help" command="close" data-keys="?">
        Close <kbd>?</kbd>
      </button>
    </dialog>
  </body>
</html>
