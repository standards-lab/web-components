# The components' tools and tasks.
# See docs/development.md
# Adapted from spike-html-apps-components (10dde51): mise.toml, its browser at web-foundation's pin.
[settings]
task.run_auto_install = false

[tools]
"github:standards-lab/claude-plugins" = { version = "0.23.0", version_prefix = "marathon/v" }
actionlint = "1.7.12"
node = "26.13.1"
pnpm = "12.21.0"
shellcheck = "0.11.0"
"github:microsoft/typescript-go" = { version = "7.0.2", version_prefix = "typescript/v", bin_path = "package/lib" }

[tools."http:chrome-headless-shell"]
version = "158.0.8127.36"
version_list_url = "https://googlechromelabs.github.io/chrome-for-testing/last-known-good-versions.json"
version_json_path = ".channels.Stable.version"

[tools."http:chrome-headless-shell".platforms]
linux-x64 = { url = "https://storage.googleapis.com/chrome-for-testing-public/{{ version }}/linux64/chrome-headless-shell-linux64.zip", checksum = "sha256:2d3a23017323c54fd457a678e4351f895c4076d8050e39d5aa6247f93448b73a", size = "132087165" }

[tasks.preflight]
description = "Fail naming mise run install when a tool the tasks need is missing"
hide = true
run = "scripts/preflight.sh"

[tasks.lint]
description = "Run the linters: ESLint, Prettier, shellcheck, actionlint, lint-context, and lint-references"
depends = ["lint:eslint", "lint:format", "lint:shell", "lint:workflows", "lint:context"]

[tasks."lint:eslint"]
description = "Lint with ESLint, the layer's imports included"
depends = ["preflight"]
run = "pnpm exec eslint ."

[tasks."lint:format"]
description = "Check the format with Prettier"
depends = ["preflight"]
run = "pnpm exec prettier --check ."

[tasks."lint:shell"]
description = "Shellcheck the scripts"
run = "shellcheck scripts/*.sh"

[tasks."lint:workflows"]
description = "Lint the GitHub Actions workflows with actionlint, which shellchecks each run: block with the pinned shellcheck"
run = "actionlint"

[tasks."lint:context"]
description = "Lint the context and every reference with marathon's lint-context and lint-references"
run = "scripts/lint-marathon.sh"

[tasks.types]
description = "Type-check the sources, the browser cases' in-page modules, and the tests with tsc"
depends = ["types:sources", "types:browser", "types:test"]

[tasks."types:sources"]
description = "Type-check the sources with tsc, on the installed foundation's declarations"
depends = ["preflight"]
run = "tsc --noEmit -p ."

[tasks."types:browser"]
description = "Type-check the browser cases' in-page modules against dist/ with tsc"
depends = ["build"]
run = "tsc --noEmit -p test/browser"

[tasks."types:test"]
description = "Type-check the Node-side tests and their helpers with tsc, never emitting"
depends = ["preflight"]
run = "tsc -p tsconfig.test.json"

[tasks.build]
description = "Build src/ into dist/: tsc's emit, with the .css beside it"
depends = ["preflight"]
run = "scripts/build.sh"

[tasks."test:unit"]
description = "Run the unit tier on the lint and a pack of the build"
depends = ["preflight", "build"]
run = "node --test 'test/unit/*.test.ts'"

[tasks."test:browser"]
description = "Run the browser tier on dist/ in the pinned chrome-headless-shell"
depends = ["preflight browser", "build"]
run = "BROWSER_EXECUTABLE=$(mise which chrome-headless-shell) node --test 'test/browser/*.test.ts'"

[tasks.check]
description = "Run every check: the linters, lint-context and lint-references among them, types, build, and the unit and browser tiers; reads no network; writes dist/"
depends = ["lint", "types", "build", "test:unit", "test:browser"]

[tasks.install]
description = "Install the pins and node_modules, the foundation at its tag; reads the network"
run = ["mise install", "pnpm install --frozen-lockfile"]

[tasks.demo]
description = "Serve the components demo page and the specimen pages, on dist/, on the loopback address"
depends = ["build"]
run = "node scripts/demo.js"

[tasks.screenshots]
description = "Capture each specimen page light and dark, in tiles, at the defaults, or --palette/--space/--type <name>, or --all; --page <name> (repeatable), --scheme light|dark, --output terminal|directory|browser, --dir <path>, --keep"
depends = ["preflight browser", "build"]
raw = true
run = "BROWSER_EXECUTABLE=$(mise which chrome-headless-shell) pnpm exec web-screenshots scripts/screenshots.config.ts"

[tasks.currency]
description = "Report every mise tool, package.json pin, action pin, the foundation's, the icons', and the tooling's tags, and the foundation's and the icons' peer ranges behind their latest, a held pin with its reason, exiting nonzero if any isn't held; reads the network"
run = "scripts/currency.sh"
quiet = true
