# Adapted from web-foundation (ceaab61): .github/workflows/ci.yml, its mise-action at its latest.
# mise run install installs every pin mise.toml names, the chrome-headless-shell the browser tier
# runs in included, and node_modules, the foundation and the tooling at their release tags.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: jdx/mise-action@v5.2.10

      - name: mise run install
        run: mise run install

      - name: mise run check
        run: mise run check
